name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save playwright@1.64.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser tests
        run: NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules" node --test test/calendar.browser.mjs
